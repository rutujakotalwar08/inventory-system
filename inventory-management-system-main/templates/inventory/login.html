{% extends 'base.html' %}

{% block title %}Login | InventoryApp{% endblock %}

{% block login_content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background-color: #f8f9fa;">
    <div class="card shadow-sm border-0" style="width: 100%; max-width: 400px; border-radius: 12px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="bi bi-box-seam text-primary" style="font-size: 3rem;"></i>
                <h3 class="fw-bold mt-2">Welcome Back</h3>
                <p class="text-muted">Sign in to InventoryApp</p>
            </div>
            
            {% if form.errors %}
                <div class="alert alert-danger border-0 shadow-sm rounded-3 py-2">
                    <small>Invalid username or password.</small>
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-medium text-muted">Username</label>
                    <input type="text" name="username" class="form-control form-control-lg bg-light" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-medium text-muted">Password</label>
                    <input type="password" name="password" class="form-control form-control-lg bg-light" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Sign In</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
